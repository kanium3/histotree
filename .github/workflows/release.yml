name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release-firefox:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.getVersion.outputs.VERSION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true

      - run: pnpm run zip:firefox

      - id: getVersion
        name: Extract version from package.json
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: .output/histotree-${{ env.VERSION }}-firefox.zip
          archive: false

  release-chrome:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.getVersion.outputs.VERSION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true

      - run: pnpm run zip

      - id: getVersion
        name: Extract version from package.json
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: .output/histotree-${{ env.VERSION }}-chrome.zip
          archive: false

  create-release:
    runs-on: ubuntu-latest
    needs: [release-chrome, release-firefox]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: temp/extensions
          merge-multiple: true

      - name: Create Release
        run: |
          CHROME_ZIP=$(find temp/extensions -type f -name "histotree-${{ needs.release-chrome.outputs.version }}-chrome.zip" -print -quit)
          FIREFOX_ZIP=$(find temp/extensions -type f -name "histotree-${{ needs.release-firefox.outputs.version }}-firefox.zip" -print -quit)

          if [ -z "$CHROME_ZIP" ] || [ -z "$FIREFOX_ZIP" ]; then
            echo "Failed to find downloaded release assets under temp/extensions"
            find temp/extensions -maxdepth 5 -type f
            exit 1
          fi

          gh release create ${{ github.ref_name }} --generate-notes "$CHROME_ZIP" "$FIREFOX_ZIP"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
